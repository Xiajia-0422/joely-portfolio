<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Product Teardown Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="intro">
      <p class="eyebrow">AI Product Teardown Cards</p>
      <h1>AI 产品拆解卡片生成器</h1>
    </section>

    <section class="workspace">
      <aside class="picker">
        <div class="tool-row">
          <button class="tool-button primary" id="new-card" type="button">新增产品</button>
        </div>
        <div class="product-list" id="product-list" aria-label="产品列表"></div>
      </aside>

      <section class="editor" aria-label="拆解编辑器">
        <form class="form" id="teardown-form">
          <label>
            产品名
            <input name="name" autocomplete="off" placeholder="例如 Cursor">
          </label>
          <label>
            类型
            <input name="category" autocomplete="off" placeholder="例如 AI Coding Tool">
          </label>
          <label>
            一句话定位
            <textarea name="positioning" rows="3" placeholder="它是什么，帮谁解决什么问题？"></textarea>
          </label>
          <label>
            目标用户
            <textarea name="users" rows="3" placeholder="谁会高频使用它？"></textarea>
          </label>
          <label>
            核心场景
            <textarea name="scenario" rows="3" placeholder="用户在什么任务里会打开它？"></textarea>
          </label>
          <label>
            AI 介入方式
            <textarea name="aiRole" rows="3" placeholder="AI 具体替用户做了哪一步？"></textarea>
          </label>
          <label>
            用户为什么留下
            <textarea name="retention" rows="3" placeholder="它如何降低成本、提升效率或形成习惯？"></textarea>
          </label>
          <label>
            商业模式
            <textarea name="business" rows="2" placeholder="订阅、团队版、API、企业采购等。"></textarea>
          </label>
          <label>
            我能学到什么
            <textarea name="lesson" rows="3" placeholder="对你做 AI 产品有什么启发？"></textarea>
          </label>
        </form>

        <div class="actions">
          <button class="tool-button primary" id="save-card" type="button">保存卡片</button>
          <button class="tool-button" id="export-card" type="button">导出 Markdown</button>
          <button class="tool-button danger" id="delete-card" type="button">删除当前</button>
        </div>

        <article class="card" id="teardown-card" aria-live="polite"></article>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
